name: Run task

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      task:
        description: "Task"
        required: true
        type: choice
        options:
          - delete_commands_task
          - upsert_global_commands_task
          - upsert_guild_commands_task

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "26.11.1"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Run selected task
        env:
          TASK_NAME: ${{ inputs.task }}
          DISCORD_APPLICATION_ID: ${{ secrets.DISCORD_APPLICATION_ID }}
          DISCORD_PUBLIC_KEY: ${{ secrets.DISCORD_PUBLIC_KEY }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
        run: |
          case "$TASK_NAME" in
            delete_commands_task|upsert_global_commands_task|upsert_guild_commands_task)
              pnpm run run "tasks/${TASK_NAME}.ts"
              ;;
            *)
              echo "Invalid task: $TASK_NAME" >&2
              exit 1
              ;;
          esac
